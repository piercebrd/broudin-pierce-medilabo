<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Patient Details</title>
    <style>
        .btn { padding: 8px 16px; margin: 5px; text-decoration: none; border: none; cursor: pointer; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-warning { background-color: #ffc107; color: black; }
        .btn-danger { background-color: #dc3545; color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .patient-info { margin: 20px 0; }
        .patient-info p { margin: 10px 0; }
        .patient-info strong { display: inline-block; width: 150px; }
        .alert-success { color:#155724; background:#d4edda; padding:8px; margin:8px 0; }
        .alert-danger  { color:#721c24; background:#f8d7da; padding:8px; margin:8px 0; }
        .note-card { border:1px solid #eee; padding:10px; margin:10px 0; }
        .badge{display:inline-block;margin-left:8px;padding:3px 8px;border-radius:10px;background:#eee;font-weight:600;}
    </style>
</head>
<body>
<h1>
    Patient Details
    <span th:if="${risk != null}" class="badge"
          th:text="${'Diabetes risk: ' + risk.risk}">Diabetes risk: …</span>
</h1>

<div th:if="${success}" class="alert-success" th:text="${success}"></div>

<div class="patient-info">
    <p><strong>ID:</strong> <span th:text="${patient.id}"></span></p>
    <p><strong>First Name:</strong> <span th:text="${patient.firstName}"></span></p>
    <p><strong>Last Name:</strong> <span th:text="${patient.lastName}"></span></p>
    <p><strong>Date of Birth:</strong> <span th:text="${patient.dateOfBirth}"></span></p>
    <p><strong>Gender:</strong> <span th:text="${patient.gender}"></span></p>
    <p><strong>Address:</strong> <span th:text="${patient.address ?: 'Not provided'}"></span></p>
    <p><strong>Phone Number:</strong> <span th:text="${patient.phoneNumber ?: 'Not provided'}"></span></p>
    <p th:if="${risk != null}"><strong>Triggers count:</strong> <span th:text="${risk.triggerCount}"></span></p>
</div>

<section style="margin-top:20px;">
    <h2>Notes</h2>

    <div th:if="${noteSuccess}" class="alert-success" th:text="${noteSuccess}"></div>
    <div th:if="${noteError}"   class="alert-danger"  th:text="${noteError}"></div>

    <div th:if="${#lists.isEmpty(notes)}">
        <p>No notes yet.</p>
    </div>
    <div th:if="${!#lists.isEmpty(notes)}">
        <div th:each="n : ${notes}" class="note-card">
            <div style="font-size:0.9rem;color:#666;" th:text="${n.createdAt}"></div>
            <pre style="white-space:pre-wrap; margin:6px 0 0 0;" th:text="${n.text}"></pre>
        </div>
    </div>

    <form th:action="@{|/patients/${patient.id}/notes|}" method="post" style="margin-top:12px;">
        <label for="text"><strong>Add a note</strong></label><br/>
        <textarea id="text" name="text" rows="6" style="width:100%;" placeholder="Type the visit note here..." required></textarea>
        <div style="margin-top:8px;">
            <button type="submit" class="btn btn-primary">Save note</button>
        </div>
    </form>
</section>

<div>
    <a th:href="@{/patients}" class="btn btn-secondary">Back to List</a>
    <a th:href="@{/patients/{id}/edit(id=${patient.id})}" class="btn btn-warning">Edit</a>
    <form th:action="@{/patients/{id}/delete(id=${patient.id})}" method="post" style="display: inline;"
          onsubmit="return confirm('Are you sure you want to delete this patient?')">
        <button type="submit" class="btn btn-danger">Delete</button>
    </form>
</div>
</body>
</html>
