<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Patient Details</title>
    <style>
        .btn { padding: 8px 16px; margin: 5px; text-decoration: none; border: none; cursor: pointer; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-warning { background-color: #ffc107; color: black; }
        .btn-danger { background-color: #dc3545; color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .patient-info { margin: 20px 0; }
        .patient-info p { margin: 10px 0; }
        .patient-info strong { display: inline-block; width: 150px; }
    </style>
</head>
<body>
<h1>Patient Details</h1>

<div class="patient-info">
    <p><strong>ID:</strong> <span th:text="${patient.id}"></span></p>
    <p><strong>First Name:</strong> <span th:text="${patient.firstName}"></span></p>
    <p><strong>Last Name:</strong> <span th:text="${patient.lastName}"></span></p>
    <p><strong>Date of Birth:</strong> <span th:text="${patient.dateOfBirth}"></span></p>
    <p><strong>Gender:</strong> <span th:text="${patient.gender}"></span></p>
    <p><strong>Address:</strong> <span th:text="${patient.address ?: 'Not provided'}"></span></p>
    <p><strong>Phone Number:</strong> <span th:text="${patient.phoneNumber ?: 'Not provided'}"></span></p>
</div>

<div>
    <a th:href="@{/patients}" class="btn btn-secondary">Back to List</a>
    <a th:href="@{/patients/{id}/edit(id=${patient.id})}" class="btn btn-warning">Edit</a>
    <form th:action="@{/patients/{id}/delete(id=${patient.id})}" method="post" style="display: inline;"
          onsubmit="return confirm('Are you sure you want to delete this patient?')">
        <button type="submit" class="btn btn-danger">Delete</button>
    </form>
</div>
</body>
</html>
