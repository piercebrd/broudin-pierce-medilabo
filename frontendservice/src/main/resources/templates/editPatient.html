<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Patient</title>
    <meta charset="UTF-8"/>
    <style>
        .form-group { margin:10px 0 }
        .form-group label { display:block; margin-bottom:5px; font-weight:600 }
        .form-group input { width:300px; padding:8px; border:1px solid #ddd }
        .btn { padding:8px 16px; margin:5px; border:none; cursor:pointer; text-decoration:none }
        .btn-primary { background:#007bff; color:#fff }
        .btn-secondary { background:#6c757d; color:#fff }
    </style>
</head>
<body>
<h1>Edit Patient</h1>

<!-- IMPORTANT: no th:object here -->
<form th:action="@{/patients/{id}/edit(id=${patient.id})}" method="post">
    <!-- keep ID so the backend knows who we're updating -->
    <input type="hidden" name="id" th:value="${patient.id}"/>

    <div class="form-group">
        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" type="text" th:value="${patient.firstName}" required>
    </div>

    <div class="form-group">
        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" type="text" th:value="${patient.lastName}" required>
    </div>

    <div class="form-group">
        <label for="dateOfBirth">Date of Birth</label>
        <!-- format LocalDate for input[type=date] -->
        <input id="dateOfBirth" name="dateOfBirth" type="date"
               th:value="${patient.dateOfBirth != null ? #temporals.format(patient.dateOfBirth,'yyyy-MM-dd') : ''}" required>
    </div>

    <div class="form-group">
        <label for="gender">Gender</label>
        <input id="gender" name="gender" type="text" th:value="${patient.gender}" required>
    </div>

    <div class="form-group">
        <label for="address">Address (Optional)</label>
        <input id="address" name="address" type="text" th:value="${patient.address}">
    </div>

    <div class="form-group">
        <label for="phoneNumber">Phone Number (Optional)</label>
        <input id="phoneNumber" name="phoneNumber" type="text" th:value="${patient.phoneNumber}">
    </div>

    <div>
        <button type="submit" class="btn btn-primary">Save changes</button>
        <a th:href="@{/patients/{id}(id=${patient.id})}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
</body>
</html>
