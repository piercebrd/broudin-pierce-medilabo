<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Patients</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn { padding: 5px 10px; margin: 2px; text-decoration: none; border: none; cursor: pointer; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-warning { background-color: #ffc107; color: black; }
        .btn-danger { background-color: #dc3545; color: white; }
        .actions { white-space: nowrap; }
    </style>
</head>
<body>
<h1>All Patients</h1>
<a th:href="@{/patients/new}" class="btn btn-success">Add New Patient</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Date of Birth</th>
        <th>Gender</th>
        <th>Phone</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="patient : ${patients}">
        <td th:text="${patient.id}"></td>
        <td th:text="${patient.firstName + ' ' + patient.lastName}"></td>
        <td th:text="${patient.dateOfBirth}"></td>
        <td th:text="${patient.gender}"></td>
        <td th:text="${patient.phoneNumber}"></td>
        <td class="actions">
            <a th:href="@{/patients/{id}(id=${patient.id})}" class="btn btn-primary">View</a>
            <a th:href="@{/patients/{id}/edit(id=${patient.id})}" class="btn btn-warning">Edit</a>
            <form th:action="@{/patients/{id}/delete(id=${patient.id})}" method="post" style="display: inline;"
                  onsubmit="return confirm('Are you sure you want to delete this patient?')">
                <button type="submit" class="btn btn-danger">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<div th:if="${#lists.isEmpty(patients)}">
    <p>No patients found. <a th:href="@{/patients/new}">Add the first patient</a></p>
</div>
</body>
</html>
