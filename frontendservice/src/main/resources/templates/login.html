<!-- src/main/resources/templates/login.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Sign in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background:#f6f7fb; margin:0; padding:0; }
    .card { max-width: 420px; margin: 8vh auto; background:#fff; border-radius:12px;
      box-shadow: 0 10px 25px rgba(0,0,0,.06); padding:28px; }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p.muted { color:#667085; margin: 0 0 18px; }
    .alert { padding:10px 12px; border-radius:8px; margin: 0 0 14px; font-size: 14px; }
    .alert.error { background:#fee4e2; color:#b42318; border:1px solid #fecdca; }
    .alert.info  { background:#e0f2fe; color:#075985; border:1px solid #bae6fd; }
    label { display:block; font-weight:600; margin:10px 0 6px; }
    input[type=text], input[type=password] {
      width:100%; padding:12px 14px; border:1px solid #e5e7eb; border-radius:10px; font-size:14px;
      outline:none; transition:border-color .15s ease;
    }
    input[type=text]:focus, input[type=password]:focus { border-color:#9ca3af; }
    button {
      width:100%; margin-top:16px; padding:12px 14px; border:0; border-radius:10px;
      background:#111827; color:#fff; font-weight:700; cursor:pointer;
    }
    .foot { text-align:center; margin-top:10px; font-size:13px; color:#6b7280; }
    a { color:#2563eb; text-decoration:none; }
    a:hover { text-decoration:underline; }
  </style>
</head>
<body>
<div class="card">
  <h1>Sign in</h1>
  <p class="muted">Please authenticate to access the patient dashboard.</p>

  <!-- Messages d’erreur / logout (pilotés par Spring Security) -->
  <div class="alert error" th:if="${param.error}">Invalid username or password.</div>
  <div class="alert info"  th:if="${param.logout}">You have been logged out.</div>

  <!-- IMPORTANT : action = /login (traité par Spring Security) -->
  <form th:action="@{/login}" method="post">
    <!-- CSRF optionnel : s’affiche si activé -->
    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />

    <button type="submit">Log in</button>
  </form>

  <div class="foot">
    <a href="/" th:href="@{/}">Back to home</a>
  </div>
</div>
</body>
</html>
