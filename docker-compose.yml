version: "3.9"

services:
  db:
    image: mysql:8
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: pokju147
      MYSQL_DATABASE: patientdb
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  patient-service:
    build: ./patientservice
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/patientdb
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=pokju147

  notes-service:
    build: ./notesservice
    image: notes-service:latest
    container_name: notes-service
    depends_on:
      - mongodb
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/notesdb
    ports:
      - "8084:8080"

  diabetes-risk-service:
    build: ./riskservice
    image: diabetes-risk-service:latest
    container_name: diabetes-risk-service
    environment:
      - PATIENT_SERVICE_URL=http://patient-service:8080
      - NOTES_SERVICE_URL=http://notes-service:8080
    depends_on:
      - patient-service
      - notes-service
    ports:
      - "8086:8080" # optional local debug

  gateway:
    build: ./gateway
    ports:
      - "8083:8080"
    depends_on:
      - patient-service
      - notes-service
      - diabetes-risk-service
    environment:
      # Notes route FIRST so it takes priority
      - SPRING_CLOUD_GATEWAY_ROUTES_0_ID=notes-service
      - SPRING_CLOUD_GATEWAY_ROUTES_0_URI=http://notes-service:8080
      - SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0=Path=/api/patients/*/notes,/api/patients/*/notes/**

      # Patient-service catch-all
      - SPRING_CLOUD_GATEWAY_ROUTES_1_ID=patient-service
      - SPRING_CLOUD_GATEWAY_ROUTES_1_URI=http://patient-service:8080
      - SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0=Path=/api/patients/**
      - SPRING_CLOUD_GATEWAY_ROUTES_1_FILTERS_0=StripPrefix=1

      # Frontend-service
      - SPRING_CLOUD_GATEWAY_ROUTES_2_ID=frontend-service
      - SPRING_CLOUD_GATEWAY_ROUTES_2_URI=http://frontend-service:8085
      - SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0=Path=/web/**
      - SPRING_CLOUD_GATEWAY_ROUTES_2_FILTERS_0=StripPrefix=1

      # Risk service
      - SPRING_CLOUD_GATEWAY_ROUTES_3_ID=diabetes-risk-service
      - SPRING_CLOUD_GATEWAY_ROUTES_3_URI=http://diabetes-risk-service:8080
      - SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0=Path=/api/risk/**
      - SPRING_CLOUD_GATEWAY_ROUTES_3_FILTERS_0=StripPrefix=0

  frontend-service:
    build: ./frontendservice
    ports:
      - "8085:8085"
    depends_on:
      - gateway

  mongodb:
    image: mongo:6
    container_name: mongodb
    environment:
      MONGO_INITDB_DATABASE: notesdb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  mongo-data:
